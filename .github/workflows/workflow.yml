name: Deploy IELTS App Backend (with backup)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Log in Docker Hub
      - name: Log in Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build and tag Docker image
      - name: Build and tag Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          BACKUP_TAG=backup-${IMAGE_TAG}

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "BACKUP_TAG=$BACKUP_TAG" >> $GITHUB_ENV

          docker build -t tungtrieu0801/ielts_app_be:$IMAGE_TAG .

          docker tag tungtrieu0801/ielts_app_be:$IMAGE_TAG \
            tungtrieu0801/ielts_app_be:latest

          docker tag tungtrieu0801/ielts_app_be:$IMAGE_TAG \
            tungtrieu0801/ielts_app_be:$BACKUP_TAG

      # 4. Push Docker images
      - name: Push Docker images
        run: |
          docker push tungtrieu0801/ielts_app_be:$IMAGE_TAG
          docker push tungtrieu0801/ielts_app_be:latest
          docker push tungtrieu0801/ielts_app_be:$BACKUP_TAG

      # 5. Deploy to VPS
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: IMAGE_TAG BACKUP_TAG
          script: |
            set -e

            cd /opt/ielts_app

            docker pull tungtrieu0801/ielts_app_be:$IMAGE_TAG

            docker compose stop backend || true

            docker rm -f ielts_app_be || true

            docker compose up -d

            docker image prune -f